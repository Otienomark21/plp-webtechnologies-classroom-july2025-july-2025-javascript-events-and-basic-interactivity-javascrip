<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Web Page</title>
    <!-- Link to the stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Use Google Fonts for a clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <div class="container">
        <!-- Main Content Section -->
        <main class="content-wrapper">
            <!-- Part 1 & 2: Interactive Elements -->
            <section class="interactive-section">
                <h2 class="section-title">Interactive Features</h2>

                <!-- Light/Dark Mode Toggle -->
                <div class="feature-card">
                    <h3 class="feature-title">Light/Dark Mode Toggle</h3>
                    <button id="themeToggleBtn" class="toggle-button">
                        <span class="icon">💡</span> Toggle Theme
                    </button>
                    <p class="feature-description">Click the button to switch between light and dark modes.</p>
                </div>

                <!-- Simple Counter -->
                <div class="feature-card">
                    <h3 class="feature-title">Simple Counter</h3>
                    <div class="counter-display">
                        <span id="counterValue">0</span>
                    </div>
                    <div class="counter-buttons">
                        <button id="decrementBtn" class="counter-button">-</button>
                        <button id="incrementBtn" class="counter-button">+</button>
                    </div>
                    <p class="feature-description">Use the buttons to increment or decrement the counter.</p>
                </div>
            </section>

            <!-- Part 3: Form Validation -->
            <section class="form-section">
                <h2 class="section-title">Sign-up Form</h2>
                <form id="signupForm" class="signup-form" novalidate>
                    <!-- Name Input -->
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" name="name" class="form-input" placeholder="e.g., Jane Doe">
                        <div id="nameError" class="error-message"></div>
                    </div>
                    
                    <!-- Email Input -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="e.g., jane@example.com">
                        <div id="emailError" class="error-message"></div>
                    </div>
                    
                    <!-- Password Input -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Must be at least 8 characters">
                        <div id="passwordError" class="error-message"></div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-button">Sign Up</button>
                    <div id="formSuccess" class="success-message"></div>
                </form>
            </section>
        </main>
    </div>

    <!-- Link to the JavaScript file at the end of the body for best practices -->
    <script src="script.js"></script>
</body>
</html>
